name: Build and publish proposal

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the frozen-paper guard (scripts/check-freeze.py) can
          # compare Paper 1 against its freeze commit.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: typst-community/setup-typst@v5

      # Pinned to the version the corpus is built and checked with locally. Unpinned,
      # the action installs the latest pandoc, and a release can change the published
      # web copies with no source change: 3.14 turned every @sec: reference into a
      # link the filter did not resolve, until it learned that form (November 2026).
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.11'

      - name: Build proposal
        run: make build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          # The corpus: one directory per paper under papers/.
          cp -r dist/papers _site/
          cp -r dist/graphs _site/
          cp -r dist/diagrams _site/
          # Deprecated transition aliases at the site root (Paper 2), kept so
          # existing inbound links keep resolving. Remove once links point at
          # papers/02-demonstrator/.
          cp dist/proposal.pdf _site/
          cp dist/proposal.md _site/
          cp dist/proposal.html _site/
          cp dist/proposal.css _site/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
