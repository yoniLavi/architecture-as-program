name = "cores"
defaultTargets = ["Cores", "Statements", "Proofs"]

# Aeneas's Lean library, built by ../setup.sh from the pinned checkout.
[[require]]
name = "aeneas"
path = "../vendor/aeneas/backends/lean"

# Generated by Aeneas from ../cores (regenerate with ../translate.sh; never edit).
[[lean_lib]]
name = "Cores"

# The theorem statements: written by the gate's side, pinned by hash in
# ../statements.sha256. A proof may not change them.
[[lean_lib]]
name = "Statements"

# The proofs of the statements.
[[lean_lib]]
name = "Proofs"
