# S1's spike crates. A workspace of their own, so `make wasm` never builds them and
# the committed Paper 2–4 components cannot move. Same profile as poc/sandbox/rust.
[workspace]
resolver = "2"
members = ["spin"]

[workspace.dependencies]
wit-bindgen = "0.59"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
