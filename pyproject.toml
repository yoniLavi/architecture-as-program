[project]
name = "architecture-as-program"
version = "0.1.0"
description = "Research proposal and accompanying PoC tooling for the Architecture as Program paradigm"
authors = [{ name = "Yoni Lavi" }]
requires-python = ">=3.11"
# The PoC validator and type parser are deliberately stdlib-only so
# the pre-commit hook stays portable. Dev tooling below is pulled in
# by `uv sync` when working on the code.
dependencies = []

[dependency-groups]
# AgentDojo's banking suite, for Paper 4's harness (poc/agentdojo/). Pinned to the
# commit the spike read (docs/agentdojo-spike.md) via [tool.uv.sources] below. It
# pulls a tree of model SDKs, so it is isolated: nothing in scripts/ and nothing
# poc/evaluate.py imports may reach it (tests/test_agentdojo_isolation.py).
agentdojo = [
    "agentdojo",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pyright>=1.1.400",
    "ruff>=0.6",
]
# Runtime PoC dependencies (poc/). Isolated: the stdlib-only validator/parser in
# scripts/ must never import these. Install with `uv sync --group poc`. Only the
# live LLM path needs the Anthropic SDK; fixture-backed runs and most tests work
# without it.
#
# No longer strictly optional for a *full* build: `make build` runs the evaluation
# harness (poc/evaluate.py), whose overhead and sandbox-tier sections need
# wasmtime, so the build target pulls this group in via `uv run --group poc`. The
# scripts/ layering rule is unaffected — the harness lives in poc/, where these
# dependencies already are.
poc = [
    "anthropic>=0.40",
    "wasmtime>=25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Expose scripts/ and the repo root as import paths so tests can
# `from type_parser import ...` (scripts/) and `from poc.runtime import ...`
# (repo root) without sys.path hacking.
pythonpath = ["scripts", "."]
addopts = "-q"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["scripts", "tests", "poc"]
extraPaths = ["scripts", "."]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "UP007", # `X | Y` vs `Union[X, Y]` — project keeps Union for now
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # Long lines acceptable in test fixtures
"poc/feeds/samples.py" = ["E501"]  # sample feed documents, verbatim

[tool.uv.sources]
agentdojo = { git = "https://github.com/ethz-spylab/agentdojo", rev = "089ed468cf3ed0322acc66b0211f26d9d90dbf60" }
