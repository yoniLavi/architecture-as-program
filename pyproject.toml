[project]
name = "architecture-as-program"
version = "0.1.0"
description = "Research proposal and accompanying PoC tooling for the Architecture as Program paradigm"
authors = [{ name = "Yoni Lavi" }]
requires-python = ">=3.11"
# The PoC validator and type parser are deliberately stdlib-only so
# the pre-commit hook stays portable. Dev tooling below is pulled in
# by `uv sync` when working on the code.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.400",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Expose scripts/ as a top-level import path so tests can
# `from type_parser import ...` and `from graph_validator import ...`
# without sys.path hacking.
pythonpath = ["scripts"]
addopts = "-q"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["scripts", "tests"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "UP007", # `X | Y` vs `Union[X, Y]` — project keeps Union for now
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # Long lines acceptable in test fixtures
