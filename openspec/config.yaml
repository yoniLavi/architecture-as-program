schema: spec-driven

# Project context for OpenSpec's skills. The authoritative notes are the repository's
# AGENTS.md (CLAUDE.md is a symlink to it); this is the part a planning step needs.
context: |
  Architecture as Program is a longitudinal research programme: a corpus of papers backed by
  a shared, tested artifact. It argues that AI coding agents, functional reactive programming
  and object-capability security converge on the signal graph as architecture model, security
  policy and source of truth. The papers are the outputs that matter.

  - Papers: Typst sources under papers/<NN>-<slug>/proposal.typ, a shared citations.bib,
    pandoc for md/html. Paper 1 is frozen and served from its published files; published
    papers change only through a new version of their record. A published paper cites no
    unpublished work.
  - Artifact: graphs/*.json are the single source of truth. scripts/ (parser, validator,
    build checks) is stdlib-only so the pre-commit hooks stay portable. poc/ holds the
    runtime, the two enforcement tiers (host, and WASM components under wasmtime), and the
    evaluation harnesses; its optional dependencies live in uv groups and never leak into
    scripts/. Python 3.11+, uv, ruff, pytest.
  - Every paper figure is interpolated from a harness's JSON output, never hand-typed.
    Harnesses pin their verdicts, and a divergence fails the build.
  - Hedging discipline: no paper or spec claims a property the implementation does not
    deliver. Unproven claims stay conditional, and a property that holds only on the confined
    tier says so.
  - Trunk-based: work lands on main, committed as it goes when the gate is green.
  - No build step and no test calls a model. Paid APIs need a committed approval.

rules:
  proposal:
    - "Open with a status line: proposed and not approved, with the date. Nothing is implemented until the author approves the change."
    - "Measure the current state before proposing (counts, commands run, the commit they ran at) and state it in Why."
    - "Say what is not in the change, as a list."
  specs:
    - "Put SHALL or MUST in the first line of each requirement's body."
    - "Keep a requirement's text before its first scenario under 500 characters: move cases and conditions into scenarios, or split the requirement. Never drop a normative sentence to fit."
    - "A delta that renames a requirement needs a RENAMED block as well as the MODIFIED one."
    - "Leave history (who found what, when) out of requirements; it belongs in the change."
  design:
    - "End with the open questions the author must answer before approval."
  tasks:
    - "Start with an approval task: 0.1, the author approves the proposal and answers the design's open questions."
    - "End with a close phase that runs make build and make spec-check, then archives. If the change adds a capability, write the new spec's Purpose in the archive commit."

operations:
  apply:
    guidance:
      - "Apply only a change the author has approved (its task 0.1 ticked). Validate it with openspec validate <id> --strict first."
      - "Commit as each coherent step goes green."
  archive:
    guidance:
      - "Run make spec-check before and after archiving."
      - "Write the Purpose of any capability the archive creates in the same commit; the placeholder fails strict validation."
