[workspace]
resolver = "2"
members = [
    "abi",
    "node_parse_message",
    "node_generate_response",
    "hostile_ambient",
    "hostile_ungranted",
]

# Small, reproducible modules: optimise for size and drop panic machinery so the
# committed .wasm artifacts stay tiny and the confinement argument is not muddied
# by an interpreter or a large runtime.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
